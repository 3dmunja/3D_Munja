workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120

    environment:
      flutter: stable
      xcode: latest
      groups:
        - appstore
      vars:
        BUNDLE_ID: "com.munja.app"
        APP_STORE_APPLE_ID: "6762185255"
        APP_VERSION: "1.0.2"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Show build environment
        script: |
          flutter --version
          xcodebuild -version
          swift --version
          echo "App version: $APP_VERSION"
          echo "Apple ID: $APP_STORE_APPLE_ID"
          grep -n "platform :ios" ios/Podfile || true
          grep -n "IPHONEOS_DEPLOYMENT_TARGET" ios/Runner.xcodeproj/project.pbxproj || true

      - name: Set automatic TestFlight build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))

          echo "Latest TestFlight build number: $LATEST_BUILD_NUMBER"
          echo "Next TestFlight build number: $NEXT_BUILD_NUMBER"

          echo "NEXT_BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> "$CM_ENV"

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --platform IOS \
            --type IOS_APP_STORE \
            --create

      - name: Set up keychain and profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build unsigned Flutter iOS app
        script: |
          flutter build ios --release --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$NEXT_BUILD_NUMBER"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace ios/Runner.xcworkspace \
            --scheme Runner

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
