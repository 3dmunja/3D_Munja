name: smart_products_app

description: "Munja smart cycling app"

publish_to: "none"

version: 1.0.3+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_blue_plus: ^1.35.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.2.3
  fl_chart: ^0.69.0
  geolocator: ^14.0.2
  google_maps_flutter: ^2.14.0
  url_launcher: ^6.3.0
  flutter_3d_controller: ^2.3.0
  flutter_foreground_task: ^9.2.2
  wakelock_plus: ^1.5.2
  geocoding: ^4.0.0
  flutter_tts: ^4.2.5
  image_picker: ^1.2.2
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.7.1
  provider: ^6.1.5+1
  firebase_storage: ^13.4.5
  file_picker: ^11.0.2
  model_viewer_plus: ^1.10.0
  crypto: ^3.0.7
  model_viewer_pro: ^2.0.4
  webview_flutter: ^4.14.1
  interactive_3d:
    path: packages/interactive_3d
  in_app_purchase: ^3.3.0
  cloud_functions: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/models/
    - assets/Images/Customize/Skins/
    - assets/brake_light.png
    - assets/munja-logo-icon.png

flutter_native_splash:
  color: "#041610"
  image: assets/munja-logo-icon.png
  android: true
  ios: true
  web: false
  fullscreen: true

  android_12:
    color: "#041610"
    image: assets/munja-logo-icon.png
    icon_background_color: "#041610"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/munja-logo-icon.png
  adaptive_icon_background: "#041610"
  adaptive_icon_foreground: assets/munja-logo-icon.png
  remove_alpha_ios: true
  min_sdk_android: 21